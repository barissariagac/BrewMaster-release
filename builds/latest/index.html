    <script>
      (function () {
        try {
          var saved = localStorage.getItem('brewmaster_theme_v1');
          var theme = saved === 'coffee-light' || saved === 'coffee-dark' ? saved : 'cream';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'coffee-dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'coffee-dark' ? '#16100C' : theme === 'coffee-light' ? '#EDE0CE' : '#F7F3EB'
            );
          }
        } catch (e) {}
